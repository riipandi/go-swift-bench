# Konfigurasi Postgres identik untuk kedua aplikasi.
listen_addresses = '*'
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top   # hanya statement yang dikirim klien (tanpa query internal FK)
pg_stat_statements.max = 10000
track_activity_query_size = 2048
shared_buffers = 512MB
max_connections = 200
synchronous_commit = off     # fsync tetap on
fsync = on
effective_cache_size = 1GB
checkpoint_timeout = 15min
max_wal_size = 2GB
log_min_messages = warning
log_checkpoints = off
