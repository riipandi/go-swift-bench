# Profil mac-m2: VM Docker >= 8 vCPU / 8 GB. cpuset memisahkan vCPU per peran.
PROFILE_NAME=mac-m2
MIN_VM_CPUS=8
MIN_VM_MEM_BYTES=8000000000
APP_CPUS=2
APP_CPUSET=0-1
APP_MEM=1g
PG_CPUS=2
PG_CPUSET=2-3
PG_MEM=2g
K6_CPUS=2
K6_CPUSET=4-5
K6_MEM=1g
SAMPLER_CPUSET=6
SAMPLER_MEM=128m
# Tahap A (VU) dan durasi (detik)
WARMUP_S=20
STAGE_A_VUS=16,32,64,128,256
STAGE_A_RAMP_S=10
STAGE_A_STEADY_S=30
STAGE_B_S=60
SOAK_S=1200
