MIN_VM_CPUS=12
MIN_VM_MEM_BYTES=10000000000
APP_CPUS=4
APP_CPUSET=0-3
APP_MEM=2g
PG_CPUS=4
PG_CPUSET=4-7
PG_MEM=4g
K6_CPUS=4
K6_CPUSET=8-11
K6_MEM=2g
SAMPLER_CPUSET=0-11
SAMPLER_MEM=128m
WARMUP_S=30
STAGE_A_VUS=8,16,32,64,128,256,512
STAGE_A_RAMP_S=15
STAGE_A_STEADY_S=60
STAGE_B_S=90
SOAK_S=1800
